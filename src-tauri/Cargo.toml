[package]
name = "gamegen-desktop"
version = "1.0.0"
description = "GameGen Desktop Application - AI-powered pixel art game creation platform"
authors = ["WorldLink Games <support@worldlinkgames.com>"]
license = "MIT"
repository = "https://github.com/worldlinkgames/gamegen"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[features]
# This feature is used for production builds or when a dev server is not specified,
# DO NOT REMOVE!
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]